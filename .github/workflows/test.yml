name: test

# The check-run conclusion from this workflow is what resolves Mission
# Control's `test` gate (FR-015a, R-010). The job name below is the status
# check required by branch protection -- renaming it will silently stop
# gating merges.
on:
  pull_request:
  push:
    branches: ["mc/task-**"]

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm test
